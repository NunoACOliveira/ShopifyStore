<!-- @dsCard group="Storefront" viewport="1280x760" name="IKKEN Store — click-through" subtitle="Splash → home → shop → product → about, in the fixed gallery frame. EN/PT, sticky buy bar, cart." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>IKKEN — Store</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--paper-300);font-family:var(--font-body);color:var(--text-primary)}#root{height:100%}a{color:var(--link)}a:hover{color:var(--link-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="./SplashScreen.jsx"></script>
<script type="text/babel" src="./HomeScreen.jsx"></script>
<script type="text/babel" src="./ShopScreen.jsx"></script>
<script type="text/babel" src="./ProductScreen.jsx"></script>
<script type="text/babel" src="./AboutScreen.jsx"></script>
<script type="text/babel" src="./ContactScreen.jsx"></script>
<script type="text/babel" src="./TermsScreen.jsx"></script>
<script type="text/babel">
const { PageFrame, CartPanel } = window.IKKENDesignSystem_c61fa2;
const A = '../../assets/products/';
const KEYS = ['SHOP', 'ABOUT', 'CONTACT', 'TERMS'];

function Store() {
  const cat = window.IKKEN_CATALOGUE;
  const [entered, setEntered] = React.useState(false);
  const [lang, setLang] = React.useState('EN');
  const [screen, setScreen] = React.useState('HOME');
  const [index, setIndex] = React.useState(0);
  const [view, setView] = React.useState(0);
  const [colour, setColour] = React.useState(cat[0].colour);
  const [cart, setCart] = React.useState([]);
  const [cartOpen, setCartOpen] = React.useState(false);
  const [added, setAdded] = React.useState(false);
  const t = window.IKKEN_COPY[lang];

  const navItems = t.nav.map((label, i) => ({ label, key: KEYS[i], href: '#' + KEYS[i].toLowerCase() }));
  const activeKey = screen === 'PRODUCT' ? 'SHOP' : screen;
  const active = (navItems.find((n) => n.key === activeKey) || {}).label;
  const product = cat[index];

  function openProduct(_p, i) {
    setIndex(i); setView(0); setColour(cat[i].colour); setAdded(false); setScreen('PRODUCT');
  }
  function step(d) {
    const n = (index + d + cat.length) % cat.length;
    setIndex(n); setView(0); setColour(cat[n].colour); setAdded(false);
  }
  function add() {
    setCart((c) => c.concat([{ key: product.id + '-' + c.length, image: product.front ? A + product.front : undefined, name: product.name, variant: product.sub.toLowerCase(), qty: 1, price: product.price, cents: product.id === 'ashtray' ? 45 : 85 }]));
    setAdded(true);
  }
  const total = '\u20ac ' + cart.reduce((s, l) => s + l.cents, 0).toFixed(2).replace('.', ',');

  if (!entered) {
    return (
      <PageFrame showChrome={false} background="none">
        <SplashScreen onEnter={() => setEntered(true)} />
      </PageFrame>
    );
  }

  return (
    <div style={{ position: 'relative', height: '100%' }}>
    <PageFrame
      scroll
      active={active}
      navItems={navItems}
      cartCount={cart.length}
      lang={lang}
      onLang={setLang}
      onCart={() => setCartOpen(true)}
      onHome={() => setScreen('HOME')}
      onNavigate={(_label, item) => setScreen(item.key)}
    >
      {screen === 'HOME' && <HomeScreen t={t} onShop={() => setScreen('SHOP')} />}
      {screen === 'SHOP' && <ShopScreen items={cat} t={t} onSelect={openProduct} />}
      {screen === 'PRODUCT' && (
        <ProductScreen
          product={product} t={t} colour={colour} onColour={setColour}
          view={view} onView={setView}
          onBack={() => step(-1)} onNext={() => step(1)}
          onAdd={add} added={added}
        />
      )}
      {screen === 'ABOUT' && <AboutScreen t={t} />}
      {screen === 'CONTACT' && <ContactScreen lang={lang} />}
      {screen === 'TERMS' && <TermsScreen t={t} lang={lang} />}
    </PageFrame>
    <CartPanel
      open={cartOpen} items={cart} total={total}
      onClose={() => setCartOpen(false)}
      onCheckout={() => setCartOpen(false)}
      onRemove={(_it, i) => setCart((c) => c.filter((_, k) => k !== i))}
    />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Store />);
</script></body></html>
