<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper-200);color:var(--text-primary);font-family:var(--font-body);padding:20px 24px}a{color:var(--link)}a:hover{color:var(--link-hover)}.lbl{font-family:var(--font-ui);font-weight:700;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-400)}.mono{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--ink-400);letter-spacing:0}.p{height:150px;background:var(--paper-200);background-image:var(--texture-page);background-size:cover;position:relative}.p span{position:absolute;inset:0;background-image:var(--scanline)}</style></head><body><div class="p"><span></span></div><div class="mono" style="margin-top:8px">--texture-page + --scanline</div></body></html>
