<!-- @dsCard group="Motion" viewport="700x170" name="Hover and press" subtitle="Opacity only. Hover fades to .45; press fades to .28 and nudges 1px down like a stamp." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper-200);color:var(--text-primary);font-family:var(--font-body);padding:20px 24px}a{color:var(--link)}a:hover{color:var(--link-hover)}.lbl{font-family:var(--font-ui);font-weight:700;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-400)}.mono{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--ink-400);letter-spacing:0}.r{display:flex;gap:40px}.t{font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:var(--tr-nav);text-transform:uppercase}</style></head><body><div class="r"><span class="t">REST</span><span class="t" style="opacity:.45">HOVER</span><span class="t" style="opacity:.28;transform:translateY(1px);display:inline-block">PRESS</span><span class="t" style="color:var(--ink-300)">DISABLED</span></div>
<div class="mono" style="margin-top:14px">--hover-fade .45 · --press-fade .28 · --press-shift 1px · no colour change, no underline, no scale</div></body></html>
