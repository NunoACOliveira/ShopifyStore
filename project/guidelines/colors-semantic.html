<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper-200);color:var(--text-primary);font-family:var(--font-body);padding:20px 24px}a{color:var(--link)}a:hover{color:var(--link-hover)}.lbl{font-family:var(--font-ui);font-weight:700;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-400)}.mono{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--ink-400);letter-spacing:0}table{border-collapse:collapse;width:100%}td{padding:4px 10px 4px 0;font-family:ui-monospace,monospace;font-size:10px;color:var(--ink-600)}td:first-child{color:var(--ink-900)}.d{width:18px;height:18px;display:inline-block;border:1px solid rgba(28,30,30,.1);vertical-align:middle}</style></head><body><table><tr><td>--surface-page</td><td>--paper-200</td><td><span class="d" style="background:var(--paper-200)"></span></td></tr><tr><td>--surface-raised</td><td>--paper-000</td><td><span class="d" style="background:var(--paper-000)"></span></td></tr><tr><td>--text-primary</td><td>--ink-900</td><td><span class="d" style="background:var(--ink-900)"></span></td></tr><tr><td>--text-secondary</td><td>--ink-600</td><td><span class="d" style="background:var(--ink-600)"></span></td></tr><tr><td>--text-muted / --text-price</td><td>--ink-400</td><td><span class="d" style="background:var(--ink-400)"></span></td></tr><tr><td>--border-hairline</td><td>--ink-200</td><td><span class="d" style="background:var(--ink-200)"></span></td></tr><tr><td>--link / --border-strong / --focus-ring</td><td>--ink-900</td><td><span class="d" style="background:var(--ink-900)"></span></td></tr><tr><td>--accent</td><td>--cw-brick</td><td><span class="d" style="background:var(--cw-brick)"></span></td></tr></table></body></html>
