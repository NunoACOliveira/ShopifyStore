<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper-200);color:var(--text-primary);font-family:var(--font-body);padding:20px 24px}a{color:var(--link)}a:hover{color:var(--link-hover)}.lbl{font-family:var(--font-ui);font-weight:700;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-400)}.mono{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--ink-400);letter-spacing:0}.g{display:grid;grid-template-columns:repeat(4,1fr);column-gap:44px;row-gap:34px;justify-items:center}.o{width:52px;height:30px;background:var(--stone-mid);filter:drop-shadow(0 10px 10px rgba(75,77,74,.25))}</style></head><body><div class="g"><div class="o"></div><div class="o"></div><div class="o"></div><div class="o"></div><div class="o"></div><div class="o"></div><div class="o"></div><div class="o"></div></div><div class="mono" style="margin-top:12px">--gutter-product 88px · --row-product 120px (halved here to fit the card)</div></body></html>
